name: "MinIO"
description: "S3-compatible object storage with the MinIO Console"
version: "0.0.1"
slug: "minio"
init: false
arch:
  - aarch64
  - amd64
webui: "http://[HOST]:[PORT:9001]"
ports:
  9000/tcp: 9000
  9001/tcp: 9001
ports_description:
  9000/tcp: "S3 API"
  9001/tcp: "MinIO Console"
map:
  - type: addon_config
    read_only: False
    path: /minio/data
schema:
  root_user: str
  root_password: password
